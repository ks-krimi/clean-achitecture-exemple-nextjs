services:
  database:
    image: postgres:14
    container_name: hanepe-rapiera-database
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:rw
    ports:
      - ${POSTGRES_PORT}:5432
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - .env
    networks:
      - hanepe-rapiera-network
networks:
  hanepe-rapiera-network:
    driver: bridge
